name: Preview Deployment

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_target:
    types: [closed]

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy preview
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.number }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKER_SUBDOMAIN }}
        run: scripts/preview/deploy.sh

      - name: Post preview comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PREVIEW_WORKER: ${{ steps.deploy.outputs.preview_worker }}
          PREVIEW_DB_NAME: ${{ steps.deploy.outputs.preview_db_name }}
          PREVIEW_DB_URL: ${{ steps.deploy.outputs.preview_db_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '<!-- preview-bot-comment -->';
            const issueNumber = context.issue.number;
            const bodyLines = [
              '🚀 Preview environment is ready!',
              '',
              `- Worker: [${process.env.PREVIEW_WORKER}](${process.env.PREVIEW_URL})`,
              `- D1 Dashboard: [${process.env.PREVIEW_DB_NAME}](${process.env.PREVIEW_DB_URL})`,
            ];
            const body = `${tag}\n${bodyLines.join('\n')}`;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: issueNumber,
            });

            const existing = comments.find((comment) => comment.body.startsWith(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body,
              });
            }

  teardown-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Teardown preview resources
        env:
          PR_NUMBER: ${{ github.event.number }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/preview/teardown.sh
