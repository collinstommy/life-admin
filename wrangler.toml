name = "life-admin"
main = "src/server.tsx"
account_id = "${CLOUDFLARE_ACCOUNT_ID}"
compatibility_date = "2023-09-18"

# Enable logging
logpush = true

[site]
bucket = "./assets"

[[kv_namespaces]]
binding = "DAILY_LOG_CACHE"
id = "4deb025f5a424e4ab756cace57bd39d0"
preview_id = "eae9aca434284992a0429673c2ca3b2e"

# R2 bucket for storing audio recordings
[[r2_buckets]]
binding = "HEALTH_RECORDINGS"
bucket_name = "health-recordings"
preview_bucket_name = "health-recordings-dev"

# Enable Cloudflare AI
[ai]
binding = "AI"

# D1 Database for health tracker
[[d1_databases]]
binding = "DB"
database_name = "health-tracker"
database_id = "305e3eb4-8b4d-4f2b-8719-c942196b1f04"
migrations_dir = "drizzle/migrations"

[env.production]
name = "life-admin"

[[env.production.d1_databases]]
binding = "DB"
database_name = "health-tracker"
database_id = "305e3eb4-8b4d-4f2b-8719-c942196b1f04"
migrations_dir = "drizzle/migrations"

[[env.production.kv_namespaces]]
binding = "DAILY_LOG_CACHE"
id = "4deb025f5a424e4ab756cace57bd39d0"
preview_id = "eae9aca434284992a0429673c2ca3b2e"

[[env.production.r2_buckets]]
binding = "HEALTH_RECORDINGS"
bucket_name = "health-recordings"
preview_bucket_name = "health-recordings-dev"

[env.production.ai]
binding = "AI"

[[env.production.routes]]
pattern = "admin.tcollins.dev"
custom_domain = true

[env.preview]
workers_dev = true

[[env.preview.d1_databases]]
binding = "DB"
database_name = "${env:PREVIEW_DATABASE_NAME}"
database_id = "${env:PREVIEW_DATABASE_ID}"
migrations_dir = "drizzle/migrations"

[[env.preview.kv_namespaces]]
binding = "DAILY_LOG_CACHE"
id = "eae9aca434284992a0429673c2ca3b2e"

[[env.preview.r2_buckets]]
binding = "HEALTH_RECORDINGS"
bucket_name = "health-recordings-dev"

[env.preview.ai]
binding = "AI"
